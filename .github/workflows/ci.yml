name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  package:
    name: Analyze, test, and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Pub publish dry run
        run: flutter pub publish --dry-run
